# Prueba y publica el juego en GitHub Pages con cada cambio en main.
name: Probar y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
  publicar:
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Versión del caché sin internet
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/" sw.js
      - name: Armar el sitio (sin las fuentes del arte ni las pruebas)
        run: |
          mkdir _sitio
          cp -r index.html estilos.css sw.js manifest.webmanifest icono.svg icono-192.png icono-512.png fuentes src _sitio/
          touch _sitio/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v5
